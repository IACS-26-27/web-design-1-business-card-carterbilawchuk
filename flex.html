        <h2>Carter Bilawchuk</h2>
        <div class="horizontal-flex">
          <div>
            <h3><b>Owner</b></h3>

          </div>
          <div class="background-image">
            <p>carter@coolbikes.com</p>
          </div>
        </div>



      </div>


      <div class="card-back">
        <div>
          <img src="https://www.eulerbikes.com/media/gjybqjq4/dsc_5618.jpg">
        </div>
        <div>
          <h1> Cool Bikes </h1>
